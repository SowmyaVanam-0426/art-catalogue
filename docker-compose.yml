services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artcatalogue
      POSTGRES_USER: artuser
      POSTGRES_PASSWORD: artpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artuser -d artcatalogue"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/artcatalogue
      DB_USERNAME: artuser
      DB_PASSWORD: artpass
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports: ["8086:8086"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8086
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  postgres_data:
