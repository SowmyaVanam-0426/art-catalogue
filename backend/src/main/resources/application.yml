server:
  port: 8086
spring:
  application:
    name: art-catalogue
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/artcatalogue}
    username: ${DB_USERNAME:artuser}
    password: ${DB_PASSWORD:artpass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
